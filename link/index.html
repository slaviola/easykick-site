<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="description" content="Tutti i canali ufficiali di EasyKick in un unico posto: Instagram, TikTok, Facebook, YouTube e download dell'app." />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/svg+xml" href="/assets/easykick_symbol.svg" />
  <link rel="apple-touch-icon" href="/assets/easykick_symbol.svg" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: #F1F5F9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 32px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #1E293B;
      border: 2px solid #4ADE80;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 0 24px rgba(74,222,128,0.25);
    }

    .avatar img {
      width: 52px;
      height: 52px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 0.95rem;
      color: #94A3B8;
      text-align: center;
      max-width: 320px;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .link-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 36px;
    }

    .link-row {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 58px;
      padding: 0 18px;
      border-radius: 16px;
      background: #1E293B;
      border: 1px solid #334155;
      color: #F1F5F9;
      text-decoration: none;
      font-weight: 600;
      font-size: 15.5px;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }

    .link-row:hover {
      transform: translateY(-2px);
      border-color: rgba(74,222,128,0.5);
    }

    .link-row-primary {
      background: linear-gradient(135deg, #4ADE80 0%, #22C55E 100%);
      border: none;
      color: #052e16;
      font-weight: 800;
      box-shadow: 0 10px 24px -8px rgba(34,197,94,0.5);
    }

    .link-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
    }

    .link-icon svg { width: 100%; height: 100%; }

    .link-label {
      flex: 1;
    }

    .link-arrow {
      flex-shrink: 0;
      opacity: 0.6;
      font-size: 15px;
    }

    .footer {
      font-size: 13px;
      color: #334155;
      text-align: center;
    }

    .footer a {
      color: #4ADE80;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

            <path d="M16 3h-2.5A4.5 4.5 0 0 0 9 7.5V10H6.5v3.5H9V21h3.5v-7.5h3l.5-3.5h-3.5V7.8c0-.99.8-1.8 1.8-1.8H16V3z" />
